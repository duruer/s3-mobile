[package]
name = "s3-cpu"
description = "x86-32 interpreter (iced-x86 decoder + decoded-block cache) for the Settlers III port"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
s3-mem.workspace = true
iced-x86.workspace = true
# Deterministic transcendentals for the x87 (pure Rust musl/fdlibm port, MIT). Pinned exactly: a version bump can
# change results and desync multiplayer peers (see docs/porting/determinism.md, golden-vector test in fpu_math.rs).
libm = { version = "=0.2.16", default-features = false }

[dev-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "intel", "code_asm"] }

[package]
name = "s3-net"
description = "Online multiplayer protocol and client for the Settlers 3 port (DirectPlay HLE transport over our relay)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true
tokio = { version = "1.47", default-features = false, features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[package]
name = "s3-android"
description = "Android NativeActivity frontend for the Settlers III port (libs3android.so)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "s3android"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Launcher, engine thread, GLES renderer, touch, audio ring (shared with iOS).
s3-frontend.workspace = true
s3-runtime.workspace = true
s3-mods.workspace = true
# LAN discovery start hook (wifilock.rs: Wi-Fi multicast lock).
s3-net.workspace = true
log = "0.4"

[features]
# The real engine. Without it (--no-default-features) the app is only the shell: status screen, input, audio.
default = ["engine"]
engine = ["s3-frontend/engine"]

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = { version = "0.9", features = ["audio", "nativewindow", "api-level-26"] }
android_logger = "0.14"
jni = "0.22"

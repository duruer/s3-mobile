[package]
name = "s3-desktop"
description = "s3run: desktop/headless runner for the Settlers III port"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "s3run"
path = "src/main.rs"

# Deterministic headless run with per-interval state hashes (determinism test, docs/porting/determinism.md).
[[bin]]
name = "s3det"
path = "src/bin/s3det.rs"

[dependencies]
s3-runtime.workspace = true
s3-engine.workspace = true
s3-mods.workspace = true
png = "0.17"
minifb = { version = "0.29", default-features = false, features = ["x11"] }
cpal = { version = "0.15", optional = true }

[features]
default = []
# Real audio playback in s3run (`--audio-play`). Needs ALSA dev files (pkg-config alsa) on Linux.
audio-cpal = ["dep:cpal"]

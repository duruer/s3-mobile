# CI + automatic releases (docs/porting/releases.md).
# Every push / pull request: unit tests. Push to main: semantic-release reads the Conventional Commits since the
# last tag (feat -> minor, fix/perf -> patch, "!" or BREAKING CHANGE -> major; docs/chore/refactor/test -> no
# release), builds the Android APK with that version, signs it with the release key and publishes a GitHub release.
# SPDX-License-Identifier: GPL-3.0-or-later
name: release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.2.12479018

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: port
          key: test
      - name: cargo test
        working-directory: port
        run: cargo test --workspace --release -j 4

  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: port
          key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;36.0.0" "platforms;android-35" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: cargo-ndk
        run: cargo install cargo-ndk --version ^4 --locked
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret ANDROID_KEYSTORE_B64 is not set; refusing to release with a new signing key"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "S3_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S3_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          npm install --no-save --no-audit --no-fund \
            semantic-release@24 @semantic-release/exec@6 conventional-changelog-conventionalcommits@8
          npx semantic-release
      - name: Remove release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
